name: Lint
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shfmt inside Docker (mvdan/shfmt)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src mvdan/shfmt:latest sh -c 'find . -name "*.sh" -type f -print0 | xargs -0 shfmt -i 0 -ci -bn -w'

      - name: Run ShellCheck inside Docker (koalaman/shellcheck-alpine)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src koalaman/shellcheck-alpine:stable sh -c 'find . -name "*.sh" -type f -print0 | xargs -0 shellcheck -x -'
